name: Make Resource Pack Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Pack Contents Correctly
        run: |
          # Zip files inside the workspace directly so assets/ and pack.mcmeta are at the root of the zip
          zip -r minecraft-spotted-wolf.zip assets pack.mcmeta pack.png
        
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotted-wolf-resource-pack
          path: minecraft-spotted-wolf.zip
